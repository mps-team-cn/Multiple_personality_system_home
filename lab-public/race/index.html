<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛车小游戏｜MPS Lab 复古赛车经营游戏</title>
  <meta name="description" content="MPS Lab 赛车小游戏是一个复古 Windows 风格的网页赛车经营小游戏，支持手机和电脑访问，包含赛道比赛、金币收益、车辆升级与轻量经营玩法。">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="desktop">
    <section class="rotate-hint" aria-label="横屏游玩提示">
      <div class="rotate-hint-window">
        <div class="title-bar">
          <span class="title-icon"></span>
          <span>横线赛车经营赛提示</span>
        </div>
        <div class="rotate-hint-body">
          <div class="phone-icon" aria-hidden="true">↻</div>
          <p>请旋转手机横屏游玩</p>
          <span>横屏后将显示赛道和右手操作区</span>
        </div>
      </div>
    </section>

    <main class="app-window" aria-label="横线赛车经营赛">
      <div class="title-bar">
        <span class="title-icon"></span>
        <span>横线赛车经营赛 v1.1</span>
        <div class="window-buttons" aria-hidden="true">
          <span>_</span>
          <span>□</span>
          <span>×</span>
        </div>
      </div>

      <nav class="menu-bar" aria-label="菜单">
        <button type="button">文件(F)</button>
        <button type="button">游戏(G)</button>
        <button type="button">帮助(H)</button>
      </nav>

      <section class="toolbar" aria-label="游戏操作">
        <button id="registerBtn" type="button">报名比赛</button>
        <button id="startBtn" type="button" disabled>起步 / 踩油门</button>
        <button id="nextBtn" type="button" disabled>下一场比赛</button>
        <button id="garageBtn" type="button">车库</button>
        <button id="shopBtn" type="button">商店</button>
        <button id="saveBtn" type="button">保存</button>
        <button id="loadBtn" type="button">读取</button>
        <button id="restartBtn" type="button">重开</button>
        <button id="exitBtn" type="button">退出</button>
      </section>

      <div class="content-grid">
        <section class="group-box race-box">
          <h1>比赛窗口</h1>
          <div class="race-layout">
            <aside class="light-panel" aria-label="起跑灯">
              <div id="redLight" class="light red"></div>
              <div id="yellowLight" class="light yellow"></div>
              <div id="greenLight" class="light green"></div>
              <div id="lightLabel" class="light-label">未报名</div>
            </aside>

            <div class="track-panel">
              <div class="marker start-marker">START</div>
              <div class="marker finish-marker">FINISH</div>
              <div id="lanes" class="lanes"></div>
            </div>
          </div>
          <div class="race-status">
            <span>状态：<strong id="phaseText">待机</strong></span>
            <span>赛事等级：<strong id="raceTierText">街边练习赛</strong></span>
            <span>报名费：<strong id="entryFeeText">200</strong> 元</span>
            <span>电脑强度：<strong id="opponentPowerText">1.00</strong></span>
          </div>
        </section>

        <aside class="group-box stats-box">
          <h2>玩家车辆状态</h2>
          <table class="stats-table">
            <tbody>
              <tr><th>引擎</th><td id="engineStat"></td></tr>
              <tr><th>轮胎</th><td id="tireStat"></td></tr>
              <tr><th>变速箱</th><td id="gearboxStat"></td></tr>
              <tr><th>稳定性</th><td id="stabilityStat"></td></tr>
              <tr><th>重量</th><td id="weightStat"></td></tr>
              <tr><th>马力</th><td id="hpStat"></td></tr>
              <tr><th>现金</th><td id="cashStat"></td></tr>
              <tr><th>比赛次数</th><td id="raceCountStat"></td></tr>
              <tr><th>赛事等级</th><td id="raceTierStat"></td></tr>
              <tr><th>上场名次</th><td id="lastRankStat"></td></tr>
            </tbody>
          </table>
        </aside>

        <section id="shopPanel" class="group-box shop-box">
          <h2>随机零件商店</h2>
          <div class="table-scroll">
            <table class="shop-table">
              <thead>
                <tr>
                  <th>零件名称</th>
                  <th>类型</th>
                  <th>稀有度</th>
                  <th>效果</th>
                  <th>价格</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="shopBody"></tbody>
            </table>
          </div>
        </section>

        <section id="garagePanel" class="group-box garage-box is-hidden">
          <h2>车库 / 零件槽位</h2>
          <p class="panel-note">每种类型只能装备一个部件。旧部件留在仓库；未装备零件可按原价 8 折出售。</p>
          <div class="table-scroll">
            <table class="garage-table">
              <thead>
                <tr>
                  <th>槽位</th>
                  <th>当前装备</th>
                  <th>效果</th>
                </tr>
              </thead>
              <tbody id="garageSlotsBody"></tbody>
            </table>
          </div>

          <h3 class="sub-heading">仓库库存</h3>
          <div class="table-scroll">
            <table class="garage-table">
              <thead>
                <tr>
                  <th>零件名称</th>
                  <th>类型</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="garageInventoryBody"></tbody>
            </table>
          </div>
        </section>

        <section class="group-box log-box">
          <h2>比赛记录</h2>
          <pre id="logOutput" class="log-output" aria-live="polite"></pre>
        </section>
      </div>
    </main>
  </div>

  <script src="./game.js"></script>
</body>
</html>
